<nav class="navbar navbar-expand-xl bg-white border-bottom shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('dashboard') }}">
            <span class="brand-mark me-2"><i class="bi bi-box-seam"></i></span>
            {{ app_name }}
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                {% for endpoint, label, icon in navigation %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == endpoint %}active fw-semibold{% endif %}"
                           href="{{ url_for(endpoint) }}">
                            <i class="bi {{ icon }} me-1"></i>{{ label }}
                        </a>
                    </li>
                {% endfor %}
            </ul>

            <div class="d-flex align-items-center gap-3 mt-3 mt-xl-0">
                <span class="small text-secondary">
                    <i class="bi bi-person-circle me-1"></i>{{ usuario_logado }}
                </span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary btn-sm">Sair</a>
            </div>
        </div>
    </div>
</nav>
